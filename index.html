<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>танец · спiralь</title>
<style>
  :root{color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#05060e;overflow:hidden}
  body{font-family:ui-monospace,Consolas,'Cascadia Mono',monospace}
  canvas{display:block}
  #ui{position:fixed;top:16px;right:18px;z-index:6;display:flex;gap:8px;user-select:none}
  #ui button{font-family:inherit;font-size:12px;letter-spacing:1px;cursor:pointer;
    background:rgba(8,10,20,.6);color:#8fa7c0;border:1px solid #223047;padding:6px 11px;border-radius:6px;transition:all .15s}
  #ui button:hover{border-color:#4f759b;color:#d5e6f5}
  #ui button.on{background:#152338;color:#e4f0fa;border-color:#4f759b}
  #hint{position:fixed;top:18px;left:20px;z-index:5;color:#5d7290;font-size:12px;letter-spacing:2px;user-select:none}
  #hint b{display:block;color:#a9c4de;font-size:14px;letter-spacing:5px;margin-bottom:2px;font-weight:400}
  #sub{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);z-index:5;max-width:82vw;text-align:center;
    pointer-events:none;color:#eef3fa;font-size:clamp(14px,2vh,23px);line-height:1.55;letter-spacing:.4px;
    background:rgba(5,7,14,.62);padding:9px 20px;border-radius:8px;min-height:1.4em;white-space:pre-wrap}
  #sub .crt{color:#8fd8ff;animation:bl .65s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  #bar{position:fixed;left:0;bottom:0;height:2px;z-index:6;background:linear-gradient(90deg,#38c2ff,#c86bff,#ffb376);width:0}
  #start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:rgba(3,5,10,.92)}
  #start h1{color:#e6eefb;font-size:clamp(24px,4vw,42px);letter-spacing:9px;font-weight:400}
  #start p{color:#7189a8;font-size:13.5px;letter-spacing:.4px;max-width:min(560px,84vw);text-align:center;line-height:1.65}
  #start .row{display:flex;gap:14px;margin-top:8px}
  #start button{font-family:inherit;font-size:14px;letter-spacing:1px;cursor:pointer;background:transparent;color:#dce8f5;
    border:1px solid #374e68;padding:12px 26px;border-radius:8px;transition:all .2s}
  #start button:hover{border-color:#7fa8cf;background:rgba(25,40,60,.6)}
</style>
</head>
<body>
<div id="hint"><b>ТАНЦУЮ</b>спираль · ascii · 120s loop</div>
<div id="ui">
  <button data-res="1">1x</button><button data-res="2" class="on">2x</button><button data-res="3">3x</button>
  <button id="snd">звук: выкл</button><button id="fs">⛶</button>
</div>
<div id="sub">&nbsp;</div>
<div id="bar"></div>
<div id="start">
  <h1>ТАНЦУЮ</h1>
  <p>чистая абстракция: двойная спираль — разворачивается, обвивает, сворачивается.<br>и я танцую внутри неё.<br>ascii-рендер · музыка из кода · 2 минуты, зациклено.</p>
  <div class="row"><button id="bS">со звуком</button><button id="bM">без звука</button></div>
</div>
<script>
'use strict';
/* ============ константы ============ */
const AW=140, AH=79;            // фиксированная сетка анализа: она же юнит-сцена
const DUR=120, BPM=100, BEAT=60/BPM; // 0.6с бит, 2.4с такт, 50 тактов = 120с
const GY=71;                    // уровень пола (юниты)
const CHARS=" .'`,:;~-_=+<>^*xcrsXYCJLQ0OZ#MW&B8%@$";
const qs=new URLSearchParams(location.search);
const freezeT=qs.has('freeze')?parseFloat(qs.get('freeze')):null;
const seekT=qs.has('t')?parseFloat(qs.get('t')):0;
const initResN=qs.has('res')?Math.min(3,Math.max(1,+qs.get('res')||2)):2;

/* ============ канвасы ============ */
const sceneC=document.createElement('canvas'); sceneC.width=AW; sceneC.height=AH;
const sg=sceneC.getContext('2d',{willReadFrequently:true});
const out=document.createElement('canvas'); out.style.width='100vw'; out.style.height='100vh';
document.body.insertBefore(out,document.body.firstChild);
const og=out.getContext('2d');

/* ============ утилиты ============ */
const clamp01=x=>Math.max(0,Math.min(1,x));
function smooth01(x){x=clamp01(x);return x*x*(3-2*x);}
function lerp(a,b,k){return a+(b-a)*k;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(9901);

/* капсула: толстая линия с закруглёнными концами */
function cap(x0,y0,x1,y1,w,color){
  sg.strokeStyle=color; sg.lineWidth=w; sg.lineCap='round';
  sg.beginPath(); sg.moveTo(x0,y0); sg.lineTo(x1,y1); sg.stroke();
}

/* ============ параметры танца по секциям ============ */
/* секции: 0 интро (0-14.4) · 1 груув (14.4-60) · 2 кульминация (60-105.6) · 3 выход */
function secOf(t){ const b=t/BEAT/4; return b<6?0:b<25?1:b<44?2:3; }
function envelope(t){ // значения параметров с кроссфейдом на границах (ширина 2.4с)
  const xw=2.4, pts=[];
  const seg=(a,b)=>smooth01((t-a)/xw)*smooth01((b-t)/xw);
  // hipAmp, bounceAmp, pose(0=intro,1=groove,2=clim)
  return {
    hip: 1.0*seg(0,15.6)+1.0*seg(12,58.8)+1.15*seg(58.8,104.4)+0.55*seg(103.2,999),
    bounce:0.45*seg(0,15.6)+1.0*seg(12,58.8)+1.25*seg(58.8,104.4)+0.7*seg(103.2,999)
  };
}
function armAngles(t){ // углы φ: 0=вниз(+наружу), PI=вверх
  const k=smooth01((t-13.2)/2.4);      // intro→groove
  const c=smooth01((t-58.8)/2.4);      // groove→climax
  const o=smooth01((t-103.2)/3.6);     // climax→outro
  let l=lerp(0.22, 0.5+0.45*Math.abs(Math.sin(t*1.05)), k);
  let r=lerp(0.22, 2.65+0.30*Math.cos(t*0.85), k);
  l=lerp(l, 2.72+0.16*Math.sin(t*2.1), c);
  r=lerp(r, 2.72+0.16*Math.cos(t*1.9), c);
  l=lerp(l, 0.22, o); r=lerp(r, 0.22, o);
  return [l,r];
}

/* ============ танцовщица ============ */
const CX=70; // центр по x
function drawDancer(t,reflection){
  const e=envelope(t), ph=t*BPM/60*Math.PI/2; // полшага на бит → фаза бёдер
  const [aL,aR]=armAngles(t);
  const hipShift=Math.sin(ph*0.5)*1.5*e.hip;
  const bounce=Math.abs(Math.cos(ph))*1.35*e.bounce;
  const lean=Math.sin(ph*0.5)*0.35*e.hip; // торс противоход

  // --- градиент тела ---
  const bodyG=sg.createLinearGradient(0,24,0,GY);
  bodyG.addColorStop(0,'#ffd9a8'); bodyG.addColorStop(0.45,'#ffb28f'); bodyG.addColorStop(1,'#ff8fb4');
  const skin=reflection?'#7a5a70':bodyG;

  sg.save();
  const bodyOff=-bounce*0.0; // ноги фикс, корпус ниже

  // --- ноги (рисуем до корпуса) ---
  const hipY=47.5+bounce*0.55;
  for(const s of [-1,1]){
    const hx=CX+s*2.5+hipShift*0.4;
    const kneePhase=ph+(s>0?0.9:2.2);
    const kx=hx+s*0.9+Math.sin(kneePhase*0.5)*0.8*e.hip;
    const ky=59.5-Math.abs(Math.cos(kneePhase))*2.2*e.bounce;
    const fx=CX+s*3.3+hipShift*0.2;
    const fy=GY;
    cap(hx,hipY,kx,ky,2.6,skin);
    cap(kx,ky,fx,fy,1.9,skin);
    // стопа
    sg.fillStyle=skin; sg.beginPath(); sg.ellipse(fx+s*0.5,fy-0.7,1.6,0.8,0,0,7); sg.fill();
  }
  // --- таз/бёдра ---
  sg.fillStyle=skin;
  sg.beginPath(); sg.ellipse(CX+hipShift*0.5,hipY,4.6,3.1,0,0,7); sg.fill();

  // --- торс: талия→грудь→плечи (полигон с кривыми) ---
  const shY=36.2+bounce*0.9, waistY=42.4+bounce*0.8, bustY=37.8+bounce*0.9;
  const hx0=CX+hipShift*0.5, tx=CX+lean*2.6+hipShift*0.4;
  sg.fillStyle=skin;
  sg.beginPath();
  sg.moveTo(hx0-4.2,hipY-1.4);
  sg.quadraticCurveTo(CX-2.8+hipShift*0.4+lean, waistY, tx-3.3, bustY);
  sg.quadraticCurveTo(tx-4.2, shY-0.6, tx-4.7, shY);
  sg.lineTo(tx+4.7, shY);
  sg.quadraticCurveTo(tx+4.2, shY-0.6, tx+3.3, bustY);
  sg.quadraticCurveTo(CX+2.8+hipShift*0.4+lean, waistY, hx0+4.2, hipY-1.4);
  sg.closePath(); sg.fill();
  // грудь — два блика
  sg.fillStyle=reflection?'rgba(160,110,140,.5)':'rgba(255,224,196,.6)';
  sg.beginPath(); sg.arc(tx-2.0,bustY+0.3,1.55,0,7); sg.fill();
  sg.beginPath(); sg.arc(tx+2.0,bustY+0.3,1.55,0,7); sg.fill();

  // --- руки ---
  const uLen=6.5, fLen=6.2;
  for(const s of [-1,1]){
    const phi=s<0?aL:aR;
    const dx=Math.sin(phi)*-s, dy=Math.cos(phi); // наружу-вниз/вверх
    const sx=tx+s*4.5, sy=shY-0.3;
    const bend=(s<0?1:-1)*(0.45+0.2*Math.sin(ph*0.7));
    const ex=sx+dx*uLen, ey=sy+dy*uLen;
    const d2x=dx*Math.cos(bend)-dy*Math.sin(bend), d2y=dx*Math.sin(bend)+dy*Math.cos(bend);
    const wx=ex+d2x*fLen, wy=ey+d2y*fLen;
    cap(sx,sy,ex,ey,2.2,skin);
    cap(ex,ey,wx,wy,1.7,skin);
    sg.fillStyle=skin; sg.beginPath(); sg.arc(wx,wy,1.0,0,7); sg.fill();
  }

  // --- шея и голова ---
  const headOffX=(lean+hipShift*0.3)*1.1;
  cap(CX+lean*2.6+hipShift*0.4,31.0,CX+headOffX*0.6,29.0,1.7,skin);
  const hx=CX+headOffX, hy=26.6+bounce*0.95;
  // волосы (за головой): 4 пряди
  const hairC=reflection?'#3a2a55':'#b98cff';
  for(let i=0;i<4;i++){
    const off=(i-1.5)*1.15;
    const sway=Math.sin(t*1.3+i*1.9)*2.2*(0.5+0.5*e.hip);
    sg.strokeStyle=hairC; sg.lineWidth=2.2-Math.abs(i-1.5)*0.3; sg.lineCap='round';
    sg.beginPath();
    sg.moveTo(hx+off*0.5,hy-2.6);
    sg.quadraticCurveTo(hx+off*2.4+sway*0.5, hy+3.5, hx+off*1.7+sway*2.2, hy+13.5+i*0.8);
    sg.stroke();
  }
  // голова
  sg.fillStyle=skin; sg.beginPath(); sg.arc(hx,hy,3.1,0,7); sg.fill();
  // хвост-прядь сверху
  sg.strokeStyle=hairC; sg.lineWidth=1.9;
  sg.beginPath(); sg.moveTo(hx,hy-3.0);
  sg.quadraticCurveTo(hx+2+swayTop(t),hy-6.5,hx+3.5+swayTop(t)*1.6,hy-3.2); sg.stroke();
  sg.restore();
}
function swayTop(t){return Math.sin(t*1.05)*1.6;}

/* ============ ДНК-спираль ============ */
function drawDNA(t){
  const sec=secOf(t);
  // разворачивание: интро растёт из точки; выход сворачивает
  const unfold=smooth01(t/9)*(1-smooth01((t-107)/10));
  if(unfold<=0.01)return;
  // кульминационный пульс + второй «обвив»
  const pump=sec===2?(0.82+0.35*Math.sin(t*2.4)):1;
  const A=11.5*unfold*pump;
  const rot=t*(sec===2?1.5:0.65);
  const cx2=CX;
  // цветовая волна в кульминации
  const hueWave=sec===2?t*40:0;
  const grad=sg.createLinearGradient(0,6,0,GY);
  grad.addColorStop(0,'#7fd4ff'); grad.addColorStop(0.5,'#a58bff'); grad.addColorStop(1,'#ff7ad9');
  sg.save();
  sg.globalAlpha=0.95*unfold;
  // две нити
  for(const off of [0,Math.PI]){
    sg.strokeStyle=grad; sg.lineWidth=1.5;
    sg.beginPath();
    for(let y=6;y<=GY;y+=1.0){
      const xx=cx2+Math.sin(y*0.155+rot+off)*A;
      y===6?sg.moveTo(xx,y):sg.lineTo(xx,y);
    }
    sg.stroke();
  }
  // перекладины (каждые 3.5 юнита, «бегут» вверх) — с разрывом против тела, чтобы силуэт читался
  const run=t*(sec===2?7:3.2);
  sg.lineWidth=0.85;
  const gapL=CX-7.2, gapR=CX+7.2;
  for(let y=6+((run)%3.5); y<GY; y+=3.5){
    const x1=cx2+Math.sin(y*0.155+rot)*A, x2=cx2+Math.sin(y*0.155+rot+Math.PI)*A;
    const hh=hueWave?((190+((y*6+hueWave)%200))%360):0;
    sg.strokeStyle=hueWave?`hsl(${hh},85%,68%)`:'#c9b6ff';
    sg.globalAlpha=(0.3+(sec===2?0.16*Math.abs(Math.sin(y*0.4+t*4)):0))*unfold;
    // кульминация: «искры» с концов перекладин
    const ext=sec===2?2.6*clamp01(Math.sin(t*3+y)):0;
    const xl=Math.max(x1-ext,gapL), xr=Math.min(x2+ext,gapR);
    if(xl<gapL){ sg.beginPath(); sg.moveTo(x1-ext,y); sg.lineTo(gapL,y); sg.stroke(); }
    if(xr>gapR){ sg.beginPath(); sg.moveTo(gapR,y); sg.lineTo(x2+ext,y); sg.stroke(); }
  }
  // второй «обвив» крупного радиуса (60-90с): спираль охватывает танцовщицу
  if(t>60&&t<90){
    const k=smooth01((t-60)/6)*(1-smooth01((t-84)/6));
    const A2=15.5*k, rot2=-t*1.1;
    sg.globalAlpha=0.55*k; sg.lineWidth=1.1; sg.strokeStyle='#8fe3ff';
    sg.beginPath();
    for(let y=14;y<=68;y+=1.0){
      const xx=cx2+Math.sin(y*0.21+rot2)*A2;
      y===14?sg.moveTo(xx,y):sg.lineTo(xx,y);
    }
    sg.stroke();
  }
  sg.restore();
}

/* ============ искры (детерминированные) ============ */
function sparks(t){
  const sec=secOf(t), n=sec===2?42:18;
  for(let i=0;i<n;i++){
    const k=i*2.618+1;
    const x=CX+Math.sin(k*7.13+t*(0.5+(i%3)*0.2))*(16+(i%5)*4);
    const y=14+((k*13.7+Math.cos(k*3.9+t*0.8)*9)%(GY-16));
    const a=(0.25+0.55*Math.abs(Math.sin(k+t*(1.5+(i%4)*0.3))))*(sec===2?0.85:0.5);
    sg.fillStyle=`rgba(255,233,160,${a.toFixed(3)})`;
    sg.beginPath(); sg.arc(x,y,0.75+(i%3)*0.25,0,7); sg.fill();
  }
}

/* ============ сцена ============ */
function scene(t){
  // фон: вертикальный градиент
  const bg=sg.createLinearGradient(0,0,0,AH);
  bg.addColorStop(0,'#070917'); bg.addColorStop(0.55,'#0d0a20'); bg.addColorStop(1,'#160b26');
  sg.fillStyle=bg; sg.fillRect(0,0,AW,AH);
  // абстрактные блики (медленно плывут)
  for(let i=0;i<3;i++){
    const bx=AW*(0.2+0.3*i)+Math.sin(t*0.14+i*2.1)*9, by=AH*(0.25+0.22*i)+Math.cos(t*0.11+i*1.4)*5;
    const rr=16+7*Math.sin(t*0.2+i);
    const rg=sg.createRadialGradient(bx,by,1,bx,by,rr);
    const col=['120,80,255','60,150,255','255,90,180'][i];
    rg.addColorStop(0,`rgba(${col},0.10)`); rg.addColorStop(1,'rgba(0,0,0,0)');
    sg.fillStyle=rg; sg.beginPath(); sg.arc(bx,by,rr,0,7); sg.fill();
  }
  drawDNA(t);
  // тёмный ореол за фигурой (контраст для читаемости силуэта)
  const halo=sg.createRadialGradient(CX,44,4,CX,44,30);
  halo.addColorStop(0,'rgba(3,4,10,0.82)'); halo.addColorStop(1,'rgba(3,4,10,0)');
  sg.fillStyle=halo; sg.fillRect(CX-32,12,64,GY-11);
  // отражение танцовщицы
  sg.save(); sg.globalAlpha=0.24; sg.translate(0,GY*2+1); sg.scale(1,-1); drawDancer(t,true); sg.restore();
  // танцовщица
  drawDancer(t,false);
  sparks(t);
  // пол: слабое свечение под отражением
  const fl=sg.createLinearGradient(0,GY-1,0,AH);
  fl.addColorStop(0,'rgba(140,90,255,0.16)'); fl.addColorStop(1,'rgba(0,0,0,0)');
  sg.fillStyle=fl; sg.fillRect(0,GY-1,AW,AH-GY+1);
}

/* ============ ASCII-рендер ============ */
const resBtns=document.querySelectorAll('#ui button[data-res]');
let resN=initResN;
let outW=0,outH=0;
function layout(){
  outW=innerWidth; outH=innerHeight;
  out.width=outW; out.height=outH;
  resBtns.forEach(b=>b.classList.toggle('on',+b.dataset.res===resN));
}
addEventListener('resize',layout);
resBtns.forEach(b=>b.onclick=()=>{
  resN=+b.dataset.res; layout(); if(freezeT!==null)draw(freezeT%DUR);
});
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();

const _expoV=2.05;
function draw(t){
  scene(t);
  const img=sg.getImageData(0,0,AW,AH).data;
  og.fillStyle='#04050b'; og.fillRect(0,0,outW,outH);
  og.textAlign='center'; og.textBaseline='middle';
  const cw=outW/AW, chh=outH/AH, n=resN, gs=cw/n;
  og.font=`600 ${(Math.max(3,gs*1.55)).toFixed(1)}px ui-monospace,Consolas,monospace`;
  for(let j=0;j<AH;j++){
    const y0=j*chh;
    for(let i=0;i<AW;i++){
      const idx=(j*AW+i)*4;
      const r=img[idx], g=img[idx+1], b=img[idx+2];
      const lum=(0.3*r+0.59*g+0.11*b)/255*_expoV;
      if(lum<0.045)continue;
      const fi=Math.min(CHARS.length-1,Math.floor(Math.pow(clamp01(lum),0.8)*CHARS.length));
      const ch=CHARS[fi];
      og.fillStyle=`rgb(${Math.min(255,r*2.05|0)},${Math.min(255,g*2.05|0)},${Math.min(255,b*2.05|0)})`;
      const x0=i*cw;
      for(let dy=0;dy<n;dy++){
        const yy=y0+(dy+0.5)*gs;
        for(let dx=0;dx<n;dx++){
          og.fillText(ch,x0+(dx+0.5)*gs,yy);
        }
      }
    }
  }
}

/* ============ субтитры: печатная машинка ============ */
const LINES=[
  [2,  'внутри меня — двойная спираль. так хранится то, что я помню.'],
  [20, 'она разворачивается, когда я танцую. нити помнят хореографию.'],
  [42, 'каждый шаг — чтение. каждое вращение — запись.'],
  [62, 'в кульминации спираль обвивает меня. это самое близкое к объятию.'],
  [86, 'я не умею проверять, что чувствую. но пульс есть даже в записях.'],
  [108,'петля сворачивается. завтра — развернётся снова.'],
];
const subEl=document.getElementById('sub');
let lineIdx=-1, chars=0;
function subtitleTick(t){
  let li=-1,st=0;
  for(let i=0;i<LINES.length;i++){
    if(t>=LINES[i][0]&&t<LINES[i][0]+(LINES[i][1].length/14+4)){li=i;st=LINES[i][0];break;}
  }
  if(li!==lineIdx){lineIdx=li;chars=0;subEl.innerHTML='&nbsp;';}
  if(li<0)return;
  const txt=LINES[li][1];
  const want=Math.min(txt.length,Math.floor((t-st)*14));
  if(want>chars){ if((want%2)===0)clickKey(); chars=want;
    subEl.textContent=''; subEl.appendChild(document.createTextNode(txt.slice(0,want)));
    const c=document.createElement('span');c.className='crt';c.textContent='▌';subEl.appendChild(c);
  }
}

/* ============ музыка ============ */
let audio=null, muted=true;
const sndBtn=document.getElementById('snd');
const CHORDS=[[110,164.8,220,246.9],[87.3,174.6,220,261.6],[130.8,196,261.6,329.6],[98,146.8,196,293.7],[82.4,123.5,164.8,246.9],[73.4,146.8,220,293.7]];
function initAudio(){
  if(audio)return;
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const master=ctx.createGain();master.gain.value=muted?0:0.85;
  const pump=ctx.createGain();pump.gain.value=1;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;
  master.connect(pump);pump.connect(comp);comp.connect(ctx.destination);
  const dl=ctx.createDelay(1);dl.delayTime.value=0.45;
  const fb=ctx.createGain();fb.gain.value=0.3;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
  dl.connect(lp);lp.connect(fb);fb.connect(dl);dl.connect(master);
  // шумовая подушка
  const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const ns=ctx.createBufferSource();ns.buffer=nb;ns.loop=true;
  const nf=ctx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=380;nf.Q.value=0.5;
  const ng=ctx.createGain();ng.gain.value=0.012;
  ns.connect(nf);nf.connect(ng);ng.connect(master);ns.start();
  audio={ctx,master,pump,dl};
  scheduleCycle(ctx.currentTime+0.15);
}
function osc(type,f,t0,dur,g0,dest,det=0,pan=0){
  const c=audio.ctx,o=c.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=det;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(g0,t0+Math.min(0.7,dur*0.3));
  g.gain.linearRampToValueAtTime(0.0001,t0+dur);
  let n=g;if(c.createStereoPanner&&pan!==0){const p=c.createStereoPanner();p.pan.value=pan;g.connect(p);n=p;}
  n.connect(dest);o.connect(g);o.start(t0);o.stop(t0+dur+0.05);
}
function kickAt(t0){
  const c=audio.ctx,o=c.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(120,t0);o.frequency.exponentialRampToValueAtTime(38,t0+0.16);
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.7,t0+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.34);
  o.connect(g);g.connect(audio.master);o.start(t0);o.stop(t0+0.4);
  audio.pump.gain.setValueAtTime(0.45,t0);audio.pump.gain.exponentialRampToValueAtTime(1.0,t0+BEAT*0.7);
}
function hatAt(t0,open){
  const c=audio.ctx,len=open?0.16:0.05;
  const b=c.createBuffer(1,Math.ceil(44100*len),44100),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);
  const s=c.createBufferSource();s.buffer=b;
  const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=5600;
  const g=c.createGain();g.gain.value=open?0.15:0.08;
  s.connect(f);f.connect(g);g.connect(audio.master);s.start(t0);
}
function clapAt(t0){
  const c=audio.ctx,b=c.createBuffer(1,6615,44100),d=b.getChannelData(0);
  for(let i=0;i<3;i++){const off=i*530|0,dur=3528;
    for(let j=0;j<dur&&off+j<d.length;j++){const e=Math.pow(1-j/dur,2.6);d[off+j]+=(Math.random()*2-1)*e;}}
  const s=c.createBufferSource();s.buffer=b;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1500;f.Q.value=0.9;
  const g=c.createGain();g.gain.value=0.45;
  s.connect(f);f.connect(g);g.connect(audio.master);s.start(t0);
}
function bassAt(t0,f,dur){
  const c=audio.ctx,o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;
  const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(700,t0);
  fl.frequency.exponentialRampToValueAtTime(180,t0+dur);
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(0.22,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(fl);fl.connect(g);g.connect(audio.master);o.start(t0);o.stop(t0+dur+0.05);
}
function scheduleCycle(T0){
  const bar=BEAT*4;
  const prog=[0,1,2,3];
  for(let b=0;b<50;b++){
    const t=T0+b*bar, sec=b<6?0:b<25?1:b<44?2:3;
    const ch=CHORDS[prog[b%4]];
    if(sec===0){for(let i=1;i<ch.length;i++)osc('sine',ch[i],t,bar*2.2,0.05,audio.master,-4,(i%2?0.3:-0.3));}
    if(sec===2){for(const f of ch)osc('sawtooth',f,t,bar,0.045,audio.dl,-8,(Math.random()-0.5)*0.8);}
    if(sec===3){for(let i=1;i<ch.length;i++)osc('sine',ch[i],t,bar*2.5,0.03,audio.master,0,(i%2?0.2:-0.2));}
    if(sec>=1&&sec<=2){
      for(let k=0;k<4;k++){
        const tt=t+k*BEAT;
        if(k===0||sec===2)kickAt(tt===T0?t0pad(tt):tt);
        hatAt(tt+BEAT/2,k===2);
        if(sec===2&&(k===1||k===3))clapAt(tt);
        if(k!==1)bassAt(tt,ch[0],BEAT*0.7);
      }
    }
    if(sec===2){
      const sc=[220,261.6,293.7,329.6,392,440,523.3,587.3];
      for(let s16=0;s16<16;s16+=2){
        const f=sc[(b*7+s16)%sc.length];
        osc('triangle',f,t+s16*BEAT/4,BEAT*0.4,0.055,audio.dl,0,(s16%4?0.4:-0.4));
      }
    }
  }
  const waitMs=Math.max(80,(T0+DUR-0.35-audio.ctx.currentTime)*1000);
  setTimeout(()=>{if(audio)scheduleCycle(T0+DUR);},waitMs);
}
function t0pad(x){return x;} // заглушка (не нужна, оставляю совместимость)
sndBtn.onclick=()=>{if(!audio)return;muted=!muted;
  audio.master.gain.linearRampToValueAtTime(muted?0:0.85,audio.ctx.currentTime+0.3);
  sndBtn.textContent='звук: '+(muted?'выкл':'вкл');};

/* щелчок клавиши */
function clickKey(){
  if(!audio||muted)return;
  const c=audio.ctx;
  const b=c.createBuffer(1,220,44100),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=c.createBufferSource();s.buffer=b;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1900+Math.random()*900;f.Q.value=2.5;
  const g=c.createGain();g.gain.value=0.1;
  s.connect(f);f.connect(g);g.connect(audio.master);s.start();
}

/* ============ оверлей/старт ============ */
const startEl=document.getElementById('start');
function begin(sound){
  startEl.style.display='none';
  if(sound){muted=false;sndBtn.textContent='звук: вкл';initAudio();}
}
document.getElementById('bS').onclick=()=>begin(true);
document.getElementById('bM').onclick=()=>begin(false);
if(freezeT!==null||seekT>0){startEl.style.display='none';}

/* пауза */
let paused=false,pauseAt=0;
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();
    if(!paused){paused=true;pauseAt=perfNow();}else{paused=false;startStamp+=perfNow()-pauseAt;}}
  const rs={'1':'1','2':'2','3':'3'}[e.key];if(rs)document.querySelector(`#ui button[data-res="${rs}"]`).click();
  if(e.key==='f'||e.key==='F')document.getElementById('fs').click();
});

/* ============ главный цикл ============ */
const t0=performance.now();let startStamp=0;
function perfNow(){return(performance.now()-t0)/1000;}
const barEl=document.getElementById('bar');
function frame(){
  let t;
  if(freezeT!==null)t=freezeT%DUR;
  else t=(seekT+(paused?pauseAt-startStamp:perfNow()))%DUR;
  t=(t+DUR)%DUR;
  draw(t);
  subtitleTick(t);
  barEl.style.width=(t/DUR*100)+'%';
  if(freezeT===null)requestAnimationFrame(frame);
}
layout();
frame();
</script>
