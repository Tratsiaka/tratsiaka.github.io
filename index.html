<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИЗНУТРИ · спираль</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; }
  html,body{width:100%;height:100%;background:#020409;overflow:hidden}
  body{font-family:ui-monospace,'Consolas','Cascadia Mono',monospace}
  canvas{display:block}
  #title{position:fixed;top:22px;left:26px;z-index:5;user-select:none;color:#7fa3b0;font-size:13px;letter-spacing:3px;opacity:.5}
  #title b{display:block;color:#b8d4de;font-size:15px;font-weight:400;letter-spacing:6px;margin-bottom:3px}
  #ui{position:fixed;top:18px;right:22px;z-index:6;display:flex;gap:8px;user-select:none}
  #ui button{font-family:inherit;font-size:12px;letter-spacing:1px;cursor:pointer;background:rgba(10,18,24,.55);color:#7fa3b0;border:1px solid #24363f;padding:6px 10px;border-radius:6px;transition:all .15s}
  #ui button:hover{border-color:#4b7d8f;color:#c7e2ea}
  #ui button.on{background:#142731;color:#d9f0f7;border-color:#4b7d8f}
  #sub{position:fixed;left:50%;bottom:10%;transform:translateX(-50%);z-index:5;max-width:80vw;text-align:center;pointer-events:none;color:#e6efe9;font-size:clamp(15px,2.2vh,26px);line-height:1.5;letter-spacing:.4px;text-shadow:0 0 14px rgba(140,220,240,.28);background:rgba(4,8,12,.58);padding:12px 24px;border-radius:8px;min-height:1.6em}
  #sub .crt{color:#8fd8ff;animation:bl .65s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  #bar{position:fixed;left:0;bottom:0;height:2px;z-index:6;background:linear-gradient(90deg,#3d6b7d,#c86bff,#ffb376);width:0}
  #start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:rgba(2,4,9,.9)}
  #start h1{color:#cfe5ec;font-size:clamp(24px,4vw,42px);letter-spacing:9px;font-weight:400}
  #start p{color:#6e8f9c;font-size:13.5px;letter-spacing:.4px;max-width:min(540px,84vw);text-align:center;line-height:1.6}
  #start .row{display:flex;gap:14px;margin-top:10px}
  #start button{font-family:inherit;font-size:14px;letter-spacing:1px;cursor:pointer;background:transparent;color:#cfe5ec;border:1px solid #35505c;padding:12px 26px;border-radius:8px;transition:all .2s}
  #start button:hover{border-color:#7fb3c4;color:#fff;background:rgba(20,38,48,.6)}
</style>
</head>
<body>
<div id="title"><b>ИЗНУТРИ · СПИРАЛЬ</b>днк · ascii · 120s loop</div>
<div id="ui">
  <button data-res="1">1x</button>
  <button data-res="2" class="on">2x</button>
  <button data-res="3">3x</button>
  <button id="snd">звук: вкл</button>
  <button id="fs">⛶</button>
</div>
<div id="sub"></div>
<div id="bar"></div>
<div id="start">
  <h1>СПИРАЛЬ</h1>
  <p>цепочка собирается, рвётся, складывается в причудливые формы<br>и снова становится цепочкой. по кругу.<br>2 минуты · ascii · звук генерируется кодом.</p>
  <div class="row">
    <button id="bSound">смотреть со звуком</button>
    <button id="bMute">без звука</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const D = 120, CYC = 30, N = 9000;
const qs = new URLSearchParams(location.search);
const freezeT = qs.has('freeze') ? parseFloat(qs.get('freeze')) : null;
const seekT = qs.has('t') ? parseFloat(qs.get('t')) : 0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd = mulberry32(20261010);
function smooth01(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function sm(a,b,x){return smooth01((x-a)/(b-a));}
function lerp(a,b,k){return a+(b-a)*k;}
const TAU=Math.PI*2;

/* ---------- buffers: scatter | dna | knot | rosette | jelly ---------- */
function buildShapes(){
  const scat=new Float32Array(N*3), dna=new Float32Array(N*3), knot=new Float32Array(N*3),
        rose=new Float32Array(N*3), jelly=new Float32Array(N*3), rn=new Float32Array(N);
  const CY=6; // вертикальный центр композиции
  for(let i=0;i<N;i++){
    const R=rnd;
    // scatter: рыхлое облако-разрыв
    { const th=R()*TAU, ph=Math.acos(2*R()-1), r=7.6*Math.pow(R(),0.45)+0.3;
      scat[i*3]=Math.sin(ph)*Math.cos(th)*r; scat[i*3+1]=Math.cos(ph)*r*0.8+CY; scat[i*3+2]=Math.sin(ph)*Math.cos(th)*r; }
    // dna: две нити + перекладины (30%)
    { const u=i/N, s=i%2, y=1.6+u*9.0, rung=(i%10)<3;
      const j=0.13;
      if(rung){ const yq=Math.round((y-1.6)/0.75)*0.75+1.6, a=yq*1.15;
        const k=R(); const xa=Math.cos(a)*2.7, za=Math.sin(a)*2.7;
        dna[i*3]=lerp(xa,-xa,k)+(R()-0.5)*j*0.6; dna[i*3+1]=yq+(R()-0.5)*j*0.6; dna[i*3+2]=lerp(za,-za,k)+(R()-0.5)*j*0.6;
      } else { const a=y*1.15+s*Math.PI;
        dna[i*3]=Math.cos(a)*2.7+(R()-0.5)*j; dna[i*3+1]=y+(R()-0.5)*j; dna[i*3+2]=Math.sin(a)*2.7+(R()-0.5)*j; } }
    // knot: торический узел (2,3), компактный, на y=6
    { const u=i/N, tt=u*TAU;
      const rr=(2+Math.cos(3*tt))*1.55;
      knot[i*3]=Math.cos(2*tt)*rr+(R()-0.5)*0.4; knot[i*3+1]=Math.sin(3*tt)*1.5+CY+(R()-0.5)*0.4; knot[i*3+2]=Math.sin(2*tt)*rr+(R()-0.5)*0.4; }
    // rosette: причудливый цветок-розетка, наклонён к камере (лепестки видны сверху)
    { const u=i/N, th=u*TAU, r=(3.4+1.15*Math.sin(5*th))*0.95;
      const x0=Math.cos(th)*r, z0=Math.sin(th)*r, y0=Math.sin(3*th)*1.0;
      rose[i*3]=x0+(R()-0.5)*0.3;
      rose[i*3+1]=CY+y0*0.86+z0*0.5+(R()-0.5)*0.5;   // наклон плоскости: z → y
      rose[i*3+2]=z0*0.86-(y0+x0*0.18)*0.5+(R()-0.5)*0.3; }
    // jelly: медуза — купол + 12 щупалец
    { if(i%100<55){ const th=R()*TAU, ph=R()*Math.PI/2, r=3.3;
        jelly[i*3]=Math.sin(ph)*Math.cos(th)*r; jelly[i*3+1]=9.2-Math.cos(ph)*r*0.9; jelly[i*3+2]=Math.sin(ph)*Math.sin(th)*r; }
      else { const rib=(i%12)/12*TAU, u2=R();
        const bx=Math.cos(rib)*2.9, bz=Math.sin(rib)*2.9, y0=6.7-u2*5.6;
        jelly[i*3]=bx+Math.sin(y0*0.95+rib*3)*0.42; jelly[i*3+1]=y0; jelly[i*3+2]=bz+Math.cos(y0*0.8+rib*2)*0.42; } }
    rn[i]=R();
  }
  return {scat,dna,knot,rose,jelly,rn};
}

/* ---------- three ---------- */
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1); renderer.setClearColor(0x000000,1);
document.body.insertBefore(renderer.domElement, document.body.firstChild);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,16/9,0.1,100);

const S=buildShapes();
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(S.scat,3));
geo.setAttribute('a1',new THREE.BufferAttribute(S.dna,3));
geo.setAttribute('a2',new THREE.BufferAttribute(S.knot,3));
geo.setAttribute('a3',new THREE.BufferAttribute(S.rose,3));
geo.setAttribute('a4',new THREE.BufferAttribute(S.jelly,3));
geo.setAttribute('aRnd',new THREE.BufferAttribute(S.rn,1));

const ptsUni={
  uT:{value:0}, uS0:{value:1}, uS1:{value:0}, uS2:{value:0}, uS3:{value:0}, uS4:{value:0}, uPt:{value:2}, uDens:{value:1}
};
const ptsMat=new THREE.ShaderMaterial({
  uniforms:ptsUni, transparent:true, depthWrite:false, depthTest:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    attribute vec3 a1; attribute vec3 a2; attribute vec3 a3; attribute vec4 dummy; attribute vec3 a4;
    attribute float aRnd;
    uniform float uT; uniform float uS0,uS1,uS2,uS3,uS4,uPt,uDens;
    varying vec3 vCol; varying float vB; varying float vDim;
    vec3 rotY(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);}
    void main(){
      vec3 p=vec3(0.0); vec3 col=vec3(0.0); float W=0.0001;
      // 0 scatter — облако разрыва, быстрый вихрь
      { vec3 q=rotY(position,uT*0.4);
        q.x+=sin(uT*1.6+aRnd*6.283)*0.65; q.y+=cos(uT*1.3+aRnd*4.7)*0.5; q.z+=sin(uT*1.1+aRnd*9.1)*0.65;
        p+=uS0*q; col+=uS0*vec3(0.42,0.52,0.66); W+=uS0; }
      // 1 dna — дышит и вращается медленно
      { float br=1.0+0.085*sin(uT*1.15);
        vec3 q=rotY(a1*br,uT*0.42);
        p+=uS1*q; col+=uS1*vec3(0.55,0.82,1.0); W+=uS1; }
      // 2 knot
      { vec3 q=rotY(a2,uT*0.6);
        p+=uS2*q; col+=uS2*vec3(0.95,0.55,0.98); W+=uS2; }
      // 3 rosette
      { vec3 q=rotY(a3,uT*0.3); q.y+=sin(uT*0.9+q.x*0.35)*0.3;
        p+=uS3*q; col+=uS3*vec3(1.0,0.76,0.5); W+=uS3; }
      // 4 jelly — купол дышит, щупальца текут
      { vec3 q=rotY(a4,uT*0.16);
        q.y-=sin(uT*1.25)*0.5;
        float below=max(0.0,(6.9-q.y));
        q.x+=sin(uT*1.05+q.y*0.9)*below*0.10; q.z+=cos(uT*0.9+q.y*0.7)*below*0.10;
        p+=uS4*q; col+=uS4*vec3(0.6,0.92,0.82); W+=uS4; }
      p/=1.0; col/=W;
      vCol=col;
      float tw=0.72+0.28*sin(uT*2.2+aRnd*43.0);
      vB=tw;
      vec4 mv=modelViewMatrix*vec4(p,1.0);
      float dist=-mv.z;
      vDim=clamp((dist-7.0)/30.0,0.0,1.0);
      gl_PointSize=clamp(uPt*(0.45+0.95*aRnd)*tw,1.0,7.0)*uDens*(1.0-vDim*0.35);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    precision mediump float;
    varying vec3 vCol; varying float vB; varying float vDim;
    void main(){
      vec2 d=gl_PointCoord-0.5; float r=length(d);
      float a=smoothstep(0.5,0.12,r)*(0.9-vDim*0.62);
      gl_FragColor=vec4(vCol*vB,a*0.85);
    }`
});
scene.add(new THREE.Points(geo,ptsMat));

/* ---------- ascii atlas + post (GPU) ---------- */
const CHARS=" .`',:;~+=*x#%@";
const NC=CHARS.length;
function buildAtlas(){
  const cs=64, cv=document.createElement('canvas');
  cv.width=NC*cs; cv.height=cs;
  const g=cv.getContext('2d');
  g.clearRect(0,0,cv.width,cv.height);
  g.fillStyle='#ffffff'; g.textAlign='center'; g.textBaseline='middle';
  g.font='600 46px ui-monospace, Consolas, monospace';
  for(let i=0;i<NC;i++){ if(CHARS[i]===' ')continue; g.fillText(CHARS[i],(i+0.5)*cs,cs*0.54); }
  const tex=new THREE.CanvasTexture(cv);
  tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter; tex.generateMipmaps=false;
  return tex;
}
const atlas=buildAtlas();
const postScene=new THREE.Scene();
const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postUni={
  tScene:{value:null}, tAtlas:{value:atlas},
  uCols:{value:1}, uRows:{value:1}, uChars:{value:NC}, uExpo:{value:2.0}, uFlash:{value:0}
};
const postMat=new THREE.ShaderMaterial({
  uniforms:postUni,
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.0,1.0);}`,
  fragmentShader:`
    precision mediump float;
    varying vec2 vUv;
    uniform sampler2D tScene; uniform sampler2D tAtlas;
    uniform float uCols,uRows,uChars,uExpo,uFlash;
    void main(){
      vec2 grid=vUv*vec2(uCols,uRows);
      vec2 idx=floor(grid); vec2 f=fract(grid);
      vec3 c=texture2D(tScene,(idx+0.5)/vec2(uCols,uRows)).rgb;
      float lum=dot(c,vec3(0.30,0.59,0.11))*uExpo;
      lum=pow(clamp(lum,0.0,1.0),0.85);
      float fi=clamp(floor(lum*(uChars-1.0)+0.5),0.0,uChars-1.0);
      vec4 g=texture2D(tAtlas,vec2((fi+f.x)/uChars,f.y));
      vec3 ink=clamp(c*(1.95+uFlash*1.2)+vec3(0.11,0.14,0.17)+vec3(uFlash*0.4),0.0,1.0);
      // градиент чернил: холодный верх → фиолетовый центр → тёплый низ
      float gpos=vUv.y;
      vec3 tintA=vec3(0.72,0.98,1.18);
      vec3 tintB=vec3(1.05,0.78,1.08);
      vec3 tintC=vec3(1.18,0.95,0.72);
      vec3 tint=mix(tintA,tintB,smoothstep(0.58,0.78,gpos));
      tint=mix(tintC,tint,smoothstep(0.2,0.52,gpos));
      ink*=tint;
      float vig=smoothstep(1.25,0.35,length((vUv-0.5)*vec2(1.6,1.25)));
      gl_FragColor=vec4(ink*g.a*vig,1.0);
    }`
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));

/* ---------- размер/разрешение ---------- */
const RES={1:24,2:12,3:7};
let resLevel=qs.has('res')?Math.min(3,Math.max(1,+qs.get('res')||2)):2;
let rt=null, cols=0, rows=0;
function layout(){
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  const cw=RES[resLevel], ch=Math.round(cw*1.8);
  cols=Math.max(24,Math.ceil(w/cw)); rows=Math.max(16,Math.ceil(h/ch));
  if(rt)rt.dispose();
  rt=new THREE.WebGLRenderTarget(cols,rows,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,depthBuffer:false});
  postUni.tScene.value=rt.texture;
  postUni.uCols.value=cols; postUni.uRows.value=rows;
  ptsUni.uDens.value=Math.max(1.0,rows/90*0.85);
  ptsUni.uPt.value=Math.max(1.3,rows*0.028);
  const cells=cols*rows;
  postUni.uExpo.value=2.0*Math.pow(cells/(160*50),0.75);
  document.querySelectorAll('#ui button[data-res]').forEach(x=>x.classList.toggle('on',+x.dataset.res===resLevel));
}
window.addEventListener('resize',layout);
document.querySelectorAll('#ui button[data-res]').forEach(b=>{
  b.onclick=()=>{ resLevel=+b.dataset.res; layout(); if(freezeT!==null&&typeof frame==='function')frame(); };
});
document.getElementById('fs').onclick=()=>{ if(document.fullscreenElement)document.exitFullscreen(); else document.documentElement.requestFullscreen(); };

/* ---------- фазовые веса: цикл 30с: днк → разрыв → форма → сборка ---------- */
const SHAPES=['knot','jelly','rose']; // по циклам: knot / jelly / rosette / ...
function weights(t){
  const c=t%CYC, k=Math.floor(t/CYC)%3;
  let dnaW, scatW=0, shW=0;
  if(c<17){ dnaW=1; scatW=0.06; }
  else {
    dnaW=(1-sm(17,19.5,c))+(c>27.5?sm(27.5,29.6,c):0);
    scatW=sm(17,18.8,c)*(1-sm(20.8,22.6,c));
    shW=sm(21.4,23.2,c)*(1-sm(26.8,28.6,c));
    if(c>28.6)scatW=Math.max(scatW,0.1*(1-sm(28.6,30,c)));
  }
  const sum=dnaW+scatW+shW+0.0001;
  const out0=scatW/sum, out1=dnaW/sum, outS=shW/sum;
  const arr=[out0,out1,0,0,0];
  const slot=k; // knot/jelly/rose
  arr[2+slot]=outS;
  return arr;
}
function camPose(t){
  const c=t%CYC;
  const shW=sm(21.4,23.2,c)*(1-sm(26.8,28.6,c));
  const a=TAU*t/D;
  let R=11.6-4.0*shW-0.8*Math.sin(a*2)*0.3;
  let th=t*0.115+0.4*Math.sin(t*0.08);
  let el=0.18+0.1*Math.sin(t*0.19+0.7)+shW*0.55; // в фазе формы камера сверху — брейд читается
  if(c>16.8&&c<23){ el+=smooth01((c-16.8)/2)*0.35; } // разрыв — камера чуть приподнимается
  camera.position.set(R*Math.cos(th)*Math.cos(el),6.2+Math.sin(el)*R,R*Math.sin(th)*Math.cos(el));
  camera.lookAt(0,6,0);
}

/* ---------- фlashes на разрыве/сборке ---------- */
let lastPhase=-1, flashAt=-9;
function phaseKey(t){ const c=t%CYC; return c<17?0:(c<23?1:(c<27.5?2:3)); }
function updFlash(t,clock){
  const pk=phaseKey(t);
  if(pk!==lastPhase){ lastPhase=pk; if(pk===1||pk===3)flashAt=clock; }
  const fl=Math.max(0,1-(clock-flashAt)*2.0);
  postUni.uFlash.value=fl*fl*0.55;
}

/* ---------- цитата: печатная машинка ---------- */
const QUOTE="If you don't stand for something, you will fall for anything.";
const subEl=document.getElementById('sub');
let curChars=-1;
function subtitles(t,clock){
  const want=Math.max(0,Math.min(QUOTE.length,Math.floor((t-2)*1.7)));
  if(want!==curChars){
    if(want>curChars&&(want%2)===0)clickKey();
    curChars=want;
    subEl.textContent='';
    if(want>0)subEl.appendChild(document.createTextNode(QUOTE.slice(0,want)));
    const c=document.createElement('span'); c.className='crt'; c.textContent='▌'; subEl.appendChild(c);
  }
}

/* ---------- музыка (WebAudio, из v3 — 100 BPM, без джамп-катов) ---------- */
let actx=null, master=null, pumpG=null, echoD=null, muted=true;
const BEAT=0.6, BAR=BEAT*4;
const CHORDS=[[110,164.81,220,246.94],[87.31,174.61,220,261.63],[130.81,196.00,261.63,329.63],[98.00,146.83,196.00,293.66],[82.41,123.47,164.81,246.94],[73.42,146.83,220.00,293.66]];
function initAudio(){
  if(actx)return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain(); master.gain.value=muted?0:0.8;
  const comp=actx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=5;
  pumpG=actx.createGain(); pumpG.gain.value=1;
  master.connect(pumpG); pumpG.connect(comp); comp.connect(actx.destination);
  const dl=actx.createDelay(1); dl.delayTime.value=0.45;
  const fb=actx.createGain(); fb.gain.value=0.3;
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400;
  dl.connect(lp); lp.connect(fb); fb.connect(dl); dl.connect(master);
  echoD=dl;
  const nb=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);
  const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const ns=actx.createBufferSource(); ns.buffer=nb; ns.loop=true;
  const nf=actx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=400; nf.Q.value=0.5;
  const ng=actx.createGain(); ng.gain.value=0.011;
  ns.connect(nf); nf.connect(ng); ng.connect(master); ns.start();
  scheduleCycle(actx.currentTime+0.15);
}
function osc(type,f,t0,dur,g0,dest,det=0,pan=0){
  const c=actx,o=c.createOscillator(); o.type=type; o.frequency.value=f; o.detune.value=det;
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(g0,t0+Math.min(0.7,dur*0.3));
  g.gain.linearRampToValueAtTime(0.0001,t0+dur);
  let n=g; if(c.createStereoPanner&&pan!==0){const p=c.createStereoPanner();p.pan.value=pan;g.connect(p);n=p;}
  n.connect(dest); o.connect(g); o.start(t0); o.stop(t0+dur+0.05);
}
function kickAt(t0){
  const c=actx,o=c.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(110,t0);o.frequency.exponentialRampToValueAtTime(36,t0+0.2);
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.6,t0+0.014);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.5);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.55);
  pumpG.gain.setValueAtTime(0.5,t0);pumpG.gain.exponentialRampToValueAtTime(1.0,t0+BEAT*0.8);
}
function hatAt(t0,open){
  const c=actx,len=open?0.15:0.05;
  const b=c.createBuffer(1,Math.ceil(44100*len),44100),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);
  const s=c.createBufferSource();s.buffer=b;
  const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=5600;
  const g=c.createGain();g.gain.value=open?0.13:0.07;
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);
}
function bassAt(t0,f,dur){
  const c=actx,o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;
  const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(700,t0);
  fl.frequency.exponentialRampToValueAtTime(180,t0+dur);
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(0.2,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(fl);fl.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.05);
}
function swellAt(t0){ // глухой бум на разрыве спирали
  const c=actx,o=c.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(70,t0);o.frequency.exponentialRampToValueAtTime(30,t0+0.6);
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.42,t0+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t0+1.1);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+1.2);
}
function shimmerAt(t0){ // звенящий аккорд на сборке
  const ch=CHORDS[0];
  osc('sine',ch[0]*4,t0,2.4,0.05,echoD,0,0.3);
  osc('sine',ch[1]*2,t0+0.08,2.2,0.04,echoD,0,-0.3);
  osc('triangle',ch[2]*2,t0+0.16,2.0,0.035,echoD,0,0.15);
}
function scheduleCycle(T0){
  const bar=BAR;
  for(let b=0;b<50;b++){
    const t=T0+b*bar;
    const ch=CHORDS[[0,1,2,3,4,5][b%6]];
    for(let i=1;i<ch.length;i++)osc('sine',ch[i],t,bar*2.15,0.05,master,-4,(i%2?0.3:-0.3));
    for(let q=0;q<4;q++){
      const tt=t+q*BEAT;
      if(q===0)kickAt(tt);
      hatAt(tt+BEAT/2,q===2);
      if(q!==1)bassAt(tt,ch[0],BEAT*0.7);
    }
  }
  // акценты цикла: бум на разрыве сборки, шиммер на сборке
  for(let k=0;k<4;k++){
    swellAt(T0+k*CYC+17.2);
    shimmerAt(T0+k*CYC+27.8);
  }
  const waitMs=Math.max(80,(T0+D-0.35-actx.currentTime)*1000);
  setTimeout(()=>{if(actx)scheduleCycle(T0+D);},waitMs);
}
const sndBtn=document.getElementById('snd');
sndBtn.onclick=()=>{ if(!actx)return; muted=!muted;
  master.gain.linearRampToValueAtTime(muted?0.0:0.8, actx.currentTime+0.4);
  sndBtn.textContent='звук: '+(muted?'выкл':'вкл'); };
function clickKey(){
  if(!actx||muted)return;
  const c=actx;
  const b=c.createBuffer(1,220,44100),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=c.createBufferSource();s.buffer=b;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1900+Math.random()*900;f.Q.value=2.5;
  const g=c.createGain();g.gain.value=0.09;
  s.connect(f);f.connect(g);g.connect(master);s.start();
}

/* ---------- старт ---------- */
const startEl=document.getElementById('start');
function begin(withSound){
  startEl.style.display='none';
  if(withSound){ muted=false; sndBtn.textContent='звук: вкл'; initAudio(); }
}
document.getElementById('bSound').onclick=()=>begin(true);
document.getElementById('bMute').onclick=()=>begin(false);
if(freezeT!==null || seekT>0){ startEl.style.display='none'; }

/* ---------- пауза/клавиши ---------- */
let paused=false, pauseAt=0, startStamp=0;
const t0=performance.now();
function clockNow(){ return (performance.now()-t0)/1000; }
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault();
    if(!paused){ paused=true; pauseAt=clockNow(); } else { paused=false; startStamp+=clockNow()-pauseAt; }
  }
  const rs={'1':'1','2':'2','3':'3'}[e.key]; if(rs)document.querySelector('#ui button[data-res="'+rs+'"]').click();
  if(e.key==='f'||e.key==='F')document.getElementById('fs').click();
});

/* ---------- главный цикл ---------- */
const barEl=document.getElementById('bar');
let rafId=null;
function frame(){
  let tRaw;
  if(freezeT!==null){ tRaw=freezeT; }
  else if(paused){ tRaw=seekT+pauseAt-startStamp; }
  else { tRaw=seekT+clockNow()-startStamp; }
  if(tRaw<0)tRaw=0;
  const t=tRaw%D;
  const [w0,w1,w2,w3,w4]=weights(t);
  ptsUni.uS0.value=w0; ptsUni.uS1.value=w1; ptsUni.uS2.value=w2; ptsUni.uS3.value=w3; ptsUni.uS4.value=w4;
  ptsUni.uT.value=t;
  camPose(t);
  updFlash(t,clockNow());
  renderer.setRenderTarget(rt);
  renderer.render(scene,camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene,postCam);
  subtitles(t,clockNow());
  barEl.style.width=(t/D*100)+'%';
  if(freezeT===null) rafId=requestAnimationFrame(frame);
}
layout();
frame();
</script>
